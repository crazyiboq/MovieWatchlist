{% extends "base.html" %}

{% block title %}Delete {{ movie.title }} | Movie Watchlist{% endblock %}

{% block content %}

<div class="delete-page">

```
<div class="delete-card">

    <div class="delete-icon">
        !
    </div>

    <p class="eyebrow">WARNING</p>

    <h1>Delete Movie?</h1>

    <p class="delete-message">
        Are you sure you want to remove
        <strong>{{ movie.title }}</strong>
        from your watchlist?
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="delete-actions">

            <button type="submit" class="danger-btn">
                Yes, Delete
            </button>

            <a href="{% url 'movie_list' %}" class="secondary-btn">
                Cancel
            </a>

        </div>

    </form>

</div>
```

</div>

{% endblock %}
